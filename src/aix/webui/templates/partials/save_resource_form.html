{% if resource_title %}
<form method="post" action="/webui/resources/saved" class="inline-flex shrink-0">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}" />
  <input type="hidden" name="kind" value="{{ resource_kind }}" />
  <input type="hidden" name="source" value="{{ resource_source }}" />
  <input type="hidden" name="title" value="{{ resource_title }}" />
  <input type="hidden" name="url" value="{{ resource_url or '' }}" />
  <input type="hidden" name="doi" value="{{ resource_item.get('doi') or '' }}" />
  <input type="hidden" name="video_id" value="{{ resource_item.get('video_id') or '' }}" />
  <input type="hidden" name="channel" value="{{ resource_item.get('channel') or '' }}" />
  <input type="hidden" name="duration_hint" value="{{ resource_item.get('duration_hint') or '' }}" />
  <input type="hidden" name="year" value="{{ resource_item.get('year') or '' }}" />
  <input type="hidden" name="journal" value="{{ resource_item.get('journal') or '' }}" />
  <input type="hidden" name="license" value="{{ resource_item.get('license') or '' }}" />
  <input type="hidden" name="provenance" value="{{ resource_source }}" />
  <input type="hidden" name="next" value="/webui/lesson/{{ lesson_id }}" />
  <button type="submit"
          class="aix-media-save"
          title="Salva nelle tue risorse"
          aria-label="Salva {{ resource_title }} nelle tue risorse">
    <wa-icon name="bookmark"></wa-icon>
  </button>
</form>
{% endif %}
