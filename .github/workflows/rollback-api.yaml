name: "rollback-graphrag-aixlearning-api"
# Puts an earlier build back online: re-points :staging (or :latest) in the
# registry to the image of an earlier commit, tagged by deploy-api.yaml. Nothing
# is rebuilt and nothing is downloaded; Watchtower on the VM picks it up within
# five minutes, or at once with `docker compose pull api-staging && docker
# compose up -d api-staging`. The commit is the 7-character code_version that
# /api/v1/health showed before the bad deploy (also in the list of deploy runs).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment to roll back"
        type: choice
        options:
          - staging
          - production
        default: staging
      commit:
        description: "The earlier commit to put back, 7 characters (e.g. e6668b7)"
        required: true
jobs:
  rollback-graphrag-api:
    runs-on: ubuntu-latest
    steps:
      -
        name: Set image version
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "image-version=latest" >> $GITHUB_ENV
          else
            echo "image-version=staging" >> $GITHUB_ENV
          fi

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud/wonderful-education
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      -
        name: Point the tag back to the earlier build
        env:
          IMAGE: rg.fr-par.scw.cloud/wonderful-education/graphrag-aixlearning
          COMMIT: ${{ inputs.commit }}
        run: |
          case "$COMMIT" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "The commit must be 7 hexadecimal characters, as /api/v1/health shows it."; exit 1 ;;
          esac
          docker buildx imagetools inspect "$IMAGE:${{ env.image-version }}-$COMMIT" > /dev/null
          docker buildx imagetools create -t "$IMAGE:${{ env.image-version }}" "$IMAGE:${{ env.image-version }}-$COMMIT"
          echo "$IMAGE:${{ env.image-version }} now points to the build of $COMMIT"
