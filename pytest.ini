[pytest]
# Pytest configuration for graphaixlearning
#
# In Phase 3 this will move into pyproject.toml under [tool.pytest.ini_options].

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers

markers =
    integration: tests that hit external services (Neo4j, OpenRouter, LLM APIs)
    slow: tests taking more than ~1 second
    unit: pure unit tests with no external dependencies

# Allow `async def test_*` without per-test decorators (needs pytest-asyncio).
asyncio_mode = auto
