services:
  api:
    env_file:
      - .env
    build:
      context: .
      target: api
    container_name: ${API_CONTAINER_NAME}
    image: rg.fr-par.scw.cloud/wonderful-education/graphrag-aixlearning:latest
    restart: unless-stopped
    ports:
      # Container now serves on 8765 (aligned with deploy/ Caddy + healthcheck);
      # host 8000 still reaches the dev API at http://localhost:8000.
      - "8000:8765"